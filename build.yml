name: Build iOS unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        shell: bash
        run: |
          set -eux
          ls -la

          if [ ! -f source.zip ]; then
            echo "::error::source.zip not found in repo root. Please upload it to the repository root."
            exit 1
          fi

          mkdir -p src
          unzip -q source.zip -d src

          echo "---- src directory ----"
          ls -la src | head -50

          PROJECT_DIR=$(find src -maxdepth 5 -name pubspec.yaml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Unable to find Flutter project root in source.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project root: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Flutter doctor / version
        run: |
          flutter --version
          xcodebuild -version

      - name: Build iOS (unsigned)
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build ios --release --no-codesign 2>&1 | tee build-ios.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -eux
          APP_PATH="$PROJECT_DIR/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app not found at $APP_PATH"
            ls -la "$PROJECT_DIR/build/ios" || true
            ls -la "$PROJECT_DIR/build/ios/iphoneos" || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry ichino-ios-unsigned.ipa Payload
          ls -lh ichino-ios-unsigned.ipa
          unzip -l ichino-ios-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ichino-ios-unsigned-ipa
          path: ichino-ios-unsigned.ipa
          if-no-files-found: error
