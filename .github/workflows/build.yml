name: Build iOS unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        shell: bash
        run: |
          set -e
          ls -la
          if [ ! -f source.zip ]; then
            echo "::error::source.zip 没有找到，请确认已上传到仓库根目录"
            exit 1
          fi
          mkdir -p src
          unzip -q source.zip -d src
          echo "---- src 顶层 ----"
          ls -la src | head -40

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Flutter doctor / version
        run: |
          flutter --version
          xcodebuild -version

      - name: Build iOS (no codesign)
        working-directory: src
        run: |
          set -e
          flutter pub get
          flutter build ios --release --no-codesign 2>&1 | tee build-ios.log

      - name: Package unsigned IPA
        run: |
          set -e
          ls -la src/build/ios/iphoneos/
          rm -rf Payload
          mkdir -p Payload
          cp -R src/build/ios/iphoneos/Runner.app Payload/
          zip -qry ichino-ios-unsigned.ipa Payload
          ls -lh ichino-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ichino-ios-unsigned-ipa
          path: ichino-ios-unsigned.ipa
          if-no-files-found: error
